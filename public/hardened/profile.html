<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Profile (hardened)</title>
  <style>
    body { font-family: Georgia, serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    #bio { min-height: 3rem; border: 1px solid #ccc; padding: 0.75rem; margin: 1rem 0; }
    textarea { width: 100%; min-height: 5rem; box-sizing: border-box; }
    button { margin-top: 0.5rem; }
    .mode { color: #060; }
  </style>
</head>
<body>
  <p class="mode">Mode: hardened</p>
  <h1>Profile: <span id="username"></span></h1>
  <div id="bio"></div>
  <form id="bio-form">
    <label>Update your bio
      <textarea id="bio-input" name="bio"></textarea>
    </label>
    <button type="submit">Save bio</button>
  </form>
  <p id="status"></p>
  <p><a href="login">Back to login</a></p>
  <script src="profile.js"></script>
</body>
</html>
