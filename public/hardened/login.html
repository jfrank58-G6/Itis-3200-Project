<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login (hardened)</title>
  <style>
    body { font-family: Georgia, serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 0.75rem; }
    input { width: 100%; padding: 0.4rem; box-sizing: border-box; }
    button { margin-top: 1rem; }
    .hint { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Login (hardened)</h1>
  <p class="hint">Demo accounts: alice / password123, bob / password123</p>
  <form method="POST" action="login">
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p><a href="/vulnerable/login">Switch to vulnerable</a></p>
</body>
</html>
